name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Smoke-test POSIX install wrapper
        if: runner.os != 'Windows' && matrix.python-version == '3.13'
        shell: bash
        run: |
          config_dir="$RUNNER_TEMP/ats-claude-config"
          sh scripts/install.sh --config-dir "$config_dir"
          test -f "$config_dir/agent-terminal-status/statusline.py"
          "$config_dir/agent-terminal-status/uninstall.sh"
          test ! -d "$config_dir/agent-terminal-status"

  powershell:
    name: ${{ matrix.shell }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    steps:
      - uses: actions/checkout@v4
      - name: Run PowerShell tests
        shell: ${{ matrix.shell }}
        run: .\tests\run.ps1

  site:
    name: Website
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run lint
